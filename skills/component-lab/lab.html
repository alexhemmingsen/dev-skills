<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Component lab</title>
<style>
  :root { --line: rgba(0,0,0,.08); --dim: rgba(0,0,0,.5); --panel: #fafafa; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #fff; color: #000; font: 12px/normal Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .018px; }
  .lab-top { display: flex; align-items: center; gap: 10px; flex: none; padding: 16px; border-bottom: 1px solid var(--line); }
  .lab-dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(0,0,0,.25); }
  .lab-crumb { color: var(--dim); }
  .lab-cols { display: flex; flex: 1; min-height: 0; }
  /* left: preview */
  .lab-left { display: flex; flex-direction: column; flex: none; min-width: 400px; border-right: 1px solid var(--line); }
  .lab-sec { padding: 16px 8px; border-bottom: 1px solid var(--line); }
  .lab-field { display: grid; gap: 8px; justify-items: start; }
  .lab-field + .lab-field { margin-top: 16px; }
  .lab-flabel { padding-left: 8px; color: var(--dim); }
  .lab-seg { display: flex; padding: .5px; border-radius: 8px; background: var(--line); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.04); }
  .lab-opt { padding: 4px 8px; border: 0; border-radius: 7.5px; background: none; color: #000; font: inherit; letter-spacing: inherit; white-space: nowrap; cursor: pointer; }
  .lab-opt[aria-pressed="true"] { background: #fff; box-shadow: 0 0 0 .5px var(--line); }
  .lab-bg { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 8px; border: 1px dashed var(--line); border-radius: 8px; color: var(--dim); cursor: pointer; }
  .lab-bg input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .lab-swatch { width: 16px; height: 16px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.14), 0 0 0 1px var(--line); }
  .lab-preview { display: grid; flex: 1; place-items: center; padding: 16px; overflow: auto; }
  /* stage: preview area and grid cells carry the axes */
  .lab-stage[data-theme="dark"] { background: #141416; color: #eee; }
  /* middle: grid of snapshots */
  .lab-mid { flex: 1; min-width: 0; overflow: auto; }
  .lab-grid { display: grid; grid-auto-rows: minmax(100px, auto); }
  .lab-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; min-width: 0; padding: 10px 14px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); pointer-events: none; user-select: none; }
  .lab-slot { width: max-content; max-width: 100%; }
  .lab-slot[data-fixed] { width: var(--slot-w); }
  .lab-cap { color: var(--dim); }
  .lab-stage[data-theme="dark"] .lab-cap { color: rgba(255,255,255,.5); }
  /* right: controls for every instance */
  .lab-right { display: flex; flex-direction: column; gap: 16px; flex: none; padding: 16px 8px; border-left: 1px solid var(--line); background: var(--panel); }
  .lab-right[hidden] { display: none; }
  .lab-fold { align-self: flex-start; display: grid; place-items: center; width: 24px; height: 16px; border: 0; background: none; color: #525252; cursor: pointer; }
  .lab-fold svg { width: 12px; height: 12px; }
  .lab-right[data-folded] .lab-fold svg { transform: rotate(180deg); }
  .lab-right[data-folded] .lab-field { display: none; }
</style>
</head>
<body>
<header class="lab-top"><span>Component lab</span><i class="lab-dot"></i><span class="lab-crumb" id="crumb"></span></header>
<div class="lab-cols">
  <section class="lab-left">
    <div class="lab-sec" id="variants"></div>
    <div class="lab-sec" id="bg"></div>
    <div class="lab-preview lab-stage" id="preview"></div>
  </section>
  <section class="lab-mid"><div class="lab-grid" id="grid"></div></section>
  <aside class="lab-right" id="controls"></aside>
</div>
<script>
// ---- Per run: replace these ----
const NAME = 'Buttons';
const VARIANTS = [{ id: 'action', label: 'Action' }, { id: 'neutral', label: 'Neutral' }]; // [] when there are none
const AXES = [ // only what changes the look of ALL instances and exists in the component
  { key: 'shape', label: 'Shape', values: [{ id: 'round', label: 'Round' }, { id: 'edgy', label: 'Edgy' }] },
  { key: 'size', label: 'Size', values: [{ id: 'sm', label: 'Small' }, { id: 'md', label: 'Medium' }, { id: 'lg', label: 'Large' }] },
  { key: 'theme', label: 'Theme', values: [{ id: 'light', label: 'Light' }, { id: 'dark', label: 'Dark' }] },
];
const CELL_WIDTH = 0; // px width of the component's slot. 0 = its natural size (buttons, chips). Set it for components that fill their container (inputs, cards, rows), e.g. 320.
const SCENARIOS = [ // { id, label, group, props, force?, variants? } variants: ids it applies to; omit for all variants
  { id: 'default', label: 'default', group: 'Data', props: {} },
  { id: 'loading', label: 'loading', group: 'Data', props: { loading: true } },
  { id: 'disabled', label: 'disabled', group: 'Data', props: { disabled: true } },
  { id: 'hover', label: 'hover', group: 'Interaction', props: {}, force: 'hover' },
  { id: 'focus', label: 'focus', group: 'Interaction', props: {}, force: 'focus' },
  { id: 'pressed', label: 'pressed', group: 'Interaction', props: {}, force: 'pressed' },
];
// render(variant, props, force, axes) returns an element: the forked component with every action stubbed.
// Set data-force when force is given. Read axes (shape, size, theme, ...) however the component does.
function render(variant, props, force, axes) {
  const el = document.createElement('button');
  el.textContent = props.loading ? 'Saving…' : 'Save';
  el.disabled = !!props.disabled;
  el.dataset.variant = variant; el.dataset.size = axes.size; el.dataset.shape = axes.shape;
  if (force) el.dataset.force = force;
  el.onclick = () => {}; // stub: nothing happens
  return el;
}
// ---- Harness: leave as is ----
const $ = (s) => document.querySelector(s);
const q = new URLSearchParams(location.search);
const st = { variant: VARIANTS.some((v) => v.id === q.get('variant')) ? q.get('variant') : VARIANTS[0] && VARIANTS[0].id, bg: /^#[0-9a-f]{6}$/i.test(q.get('bg') || '') ? q.get('bg') : '' };
AXES.forEach((a) => { st[a.key] = a.values.some((v) => v.id === q.get(a.key)) ? q.get(a.key) : a.values[0].id; });
const axes = () => Object.fromEntries(AXES.map((a) => [a.key, st[a.key]]));
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function sync() { const u = new URL(location); ['variant', 'bg', ...AXES.map((a) => a.key)].forEach((k) => st[k] ? u.searchParams.set(k, st[k]) : u.searchParams.delete(k)); history.replaceState(null, '', u); }
function seg(label, key, options) {
  const f = el('div', 'lab-field'); if (label) f.append(el('div', 'lab-flabel', label));
  const s = el('div', 'lab-seg');
  options.forEach((o) => { const b = el('button', 'lab-opt', o.label); b.setAttribute('aria-pressed', String(st[key] === o.id)); b.onclick = () => { st[key] = o.id; sync(); draw(); }; s.append(b); });
  f.append(s); return f;
}
const scenarios = () => SCENARIOS.filter((s) => !s.variants || s.variants.includes(st.variant));
function slot(node) { const s = el('div', 'lab-slot'); if (CELL_WIDTH) { s.dataset.fixed = ''; s.style.setProperty('--slot-w', CELL_WIDTH + 'px'); } s.append(node); return s; }
function stage(node) { AXES.forEach((a) => node.dataset[a.key] = st[a.key]); }
function drawLeft() {
  const v = $('#variants'); v.replaceChildren(VARIANTS.length > 1 ? seg('Preview', 'variant', VARIANTS) : Object.assign(el('div', 'lab-flabel', 'Preview')));
  const b = $('#bg'); const chip = el('label', 'lab-bg'); const sw = el('span', 'lab-swatch'); const input = el('input'); input.type = 'color'; input.value = st.bg || '#ffffff';
  sw.style.background = st.bg || '#ffffff';
  input.oninput = () => { st.bg = input.value; sw.style.background = st.bg; $('#preview').style.background = st.bg; sync(); };
  chip.append(input, sw, el('span', '', 'Background color')); b.replaceChildren(chip);
  const p = $('#preview'); stage(p); p.style.background = st.bg; p.replaceChildren(slot(render(st.variant, (scenarios()[0] || {}).props || {}, '', axes())));
}
function drawGrid() {
  const g = $('#grid'); g.replaceChildren();
  scenarios().forEach((s) => { // only the states of the selected variant
    const c = el('div', 'lab-cell lab-stage'); stage(c);
    c.append(el('span', 'lab-cap', s.label), slot(render(st.variant, s.props, s.force, axes()))); g.append(c);
  });
  layoutGrid();
}
// Columns follow the component: wide enough that nothing overflows or overlaps, as many as fit, and the last row is filled out so the grid is always a complete rectangle (1 cell or 40).
function layoutGrid() {
  const g = $('#grid'); g.querySelectorAll('.lab-fill').forEach((n) => n.remove());
  const cells = [...g.querySelectorAll('.lab-cell')]; if (!cells.length) return;
  const natural = Math.max(...cells.map((c) => c.querySelector('.lab-slot').getBoundingClientRect().width));
  const colW = Math.max(160, Math.ceil(CELL_WIDTH || natural) + 30);
  const cols = Math.max(1, Math.min(cells.length, Math.floor($('.lab-mid').clientWidth / colW)));
  g.style.gridTemplateColumns = `repeat(${cols}, minmax(${colW}px, 1fr))`;
  for (let i = (cols - (cells.length % cols)) % cols; i > 0; i--) g.append(el('div', 'lab-cell lab-fill'));
}
function drawControls() {
  const c = $('#controls'); c.hidden = !AXES.length; if (!AXES.length) return;
  const fold = el('button', 'lab-fold'); fold.setAttribute('aria-label', 'Collapse controls'); fold.innerHTML = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 2.5 6 6l-3.5 3.5M6.5 2.5 10 6 6.5 9.5"/></svg>';
  fold.onclick = () => { c.toggleAttribute('data-folded'); };
  c.replaceChildren(fold, ...AXES.map((a) => seg(a.label, a.key, a.values)));
}
function draw() { $('#crumb').textContent = NAME; drawLeft(); drawGrid(); drawControls(); }
draw();
new ResizeObserver(layoutGrid).observe($('.lab-mid'));
</script>
</body>
</html>
